<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <meta name="color-scheme" content="light dark">
  <title>Аляска, Тернопіль — куди піти</title>
  <meta name="description" content="Де поїсти, де погуляти і що побачити в районі Аляска у Тернополі: інтерактивна карта з маршрутами.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <style>
    :root { --bg:#fafafa; --ink:#111; --muted:#777; --line:#e4e4e4; --accent:#e5484d; --ok:#2f9e44; --pin:28px; --sh:0px; }
    body.dark { --bg:#121212; --ink:#eee; --muted:#8a8a8a; --line:#2a2a2a; --ok:#51cf66; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background .3s, color .3s; touch-action: manipulation; }

    header { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
      padding-left: calc(20px + env(safe-area-inset-left, 0px)); padding-right: calc(20px + env(safe-area-inset-right, 0px));
      border-bottom: 1px solid var(--line); background: var(--bg); position: relative; z-index: 1200; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tools { display: flex; gap: 16px; flex: none; }
    .link { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px; text-decoration-color: var(--line); transition: color .15s; }
    .link:hover, .link.on { color: var(--ink); }
    .link.on { text-decoration-color: var(--ink); }
    .tb { display: inline-flex; align-items: center; gap: 6px; }
    .tb[data-busy] { opacity: .5; }

    /* ---------- макет: мобільний (за замовчуванням) ---------- */
    main { flex: 1; min-height: 0; position: relative; display: grid; grid-template-columns: 1fr; overflow: hidden; }
    #map { position: absolute; inset: 0; background: #f0f0f0; }
    body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }

    #side { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100; height: 50%; display: flex; flex-direction: column; min-height: 0;
      background: var(--bg); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.14);
      padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; transition: height .5s cubic-bezier(.3,1.12,.4,1); }
    #side.drag { transition: none; }
    #grab { flex: none; height: 28px; display: grid; place-items: center; cursor: grab; touch-action: none; }
    #grab::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--muted); opacity: .45; transition: opacity .15s, width .15s; }
    #grab:hover::before, #grab:focus-visible::before { opacity: .9; width: 52px; }

    #top { flex: none; padding: 0 16px 8px; }
    #q { width: 100%; padding: 10px 16px; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; outline: 0; transition: border-color .15s; -webkit-appearance: none; appearance: none; }
    #q:focus { border-color: var(--ink); }
    #chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 2px; margin: 0 -16px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 20px), transparent); }
    #chips::-webkit-scrollbar { display: none; }
    #chips button { flex: none; padding: 7px 14px; font: inherit; font-size: 14px; color: var(--ink); background: transparent;
      border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: .15s; white-space: nowrap; }
    #chips button:hover { border-color: var(--ink); }
    #chips button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    #chips button:active { transform: scale(.96); }
    #bar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 4px 16px; color: var(--muted); font-size: 13px; }

    #list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 16px 20px; }
    .item { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; animation: rise .35s ease-out both; }
    .item:hover b { text-decoration: underline; text-underline-offset: 3px; }
    .item small { display: block; color: var(--muted); }
    .item .f { flex: none; min-width: 44px; min-height: 44px; margin: -8px -10px -8px 0; font-size: 18px; display: grid; place-items: center; text-decoration: none; }
    .empty { color: var(--muted); padding: 24px 0; }
    .st { display: inline-flex; align-items: center; gap: 4px; }
    .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
    .st.on::before { background: var(--ok); } .st.off::before { background: var(--accent); }

    #detail { display: none; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 4px 16px 24px; animation: rise .35s ease-out both; }
    #side.open #detail { display: block; }
    #side.open #top, #side.open #bar, #side.open #list { display: none; }
    #detail h2 { margin: 12px 0 0; font-size: 22px; letter-spacing: -.01em; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 14px; }
    #detail ul { margin: 8px 0; padding-left: 18px; color: var(--muted); }
    .kv { margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
    .acts { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
    .modes { display: flex; gap: 16px; margin: 12px 0 4px; }
    #back { display: inline-flex; align-items: center; min-height: 36px; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* кнопки на карті */
    .fabs { position: absolute; z-index: 1050; right: 12px; bottom: calc(var(--sh) + 12px); display: flex; flex-direction: column; gap: 10px; transition: bottom .5s cubic-bezier(.3,1.12,.4,1); }
    #side.drag ~ .fabs { transition: none; }
    .fab { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: pointer; padding: 0; transition: transform .15s; }
    .fab:active { transform: scale(.92); }
    .fab[data-busy] svg { animation: wob .5s ease-in-out infinite; }

    .toast { position: fixed; z-index: 2000; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -8px);
      max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- макет: десктоп ---------- */
    @media (min-width: 800px) {
      main { grid-template-columns: 400px 1fr; }
      #map { position: relative; inset: auto; order: 2; }
      #side { position: relative; height: auto !important; border-radius: 0; box-shadow: none; border-top: 0; border-right: 1px solid var(--line);
        transition: none; z-index: auto; padding-bottom: 0; }
      #grab { display: none; }
      #top { padding: 14px 20px 10px; }
      #chips { flex-wrap: wrap; overflow: visible; margin: 0; padding: 12px 0 2px; -webkit-mask-image: none; mask-image: none; }
      #chips button { padding: 5px 14px; }
      #bar { padding: 6px 20px; } #list { padding: 0 20px 20px; } #detail { padding: 14px 20px 24px; }
      .item .f { margin-right: 0; min-width: 0; min-height: 0; display: inline; }
      .fabs { bottom: 28px; }
    }
    @media (max-width: 799px) {
      header { padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px)); }
      header h1 { font-size: 16px; }
      .tools { gap: 4px; }
      .tb { width: 40px; height: 40px; justify-content: center; border-radius: 50%; }
      .tb span { display: none; }
      .tb:active { background: var(--line); }
      #detail .link { min-height: 36px; }
    }
    @media (pointer: coarse) { .leaflet-control-zoom { display: none; } .link.act { padding: 6px 0; } }
    /* телефон у горизонтальній орієнтації: панель ліворуч */
    @media (max-width: 799px) and (orientation: landscape) and (max-height: 500px) {
      #side { right: auto; width: min(380px, 55vw); height: 100% !important; border-radius: 0 18px 0 0; padding-left: env(safe-area-inset-left, 0px); }
      #grab { display: none; }
      .fabs { bottom: 12px; }
    }

    /* маркери */
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--ink); }
    .pin { width: var(--pin); height: var(--pin); border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      border: 1.5px solid var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .15s, background .15s, color .15s, border-color .15s; }
    .pin svg { width: 55%; height: 55%; }
    .pin:hover, .pin.hov { transform: scale(1.2); }
    .pin.fav { border-color: var(--accent); color: var(--accent); }
    .pin.sel { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.2); }
    #chips svg { vertical-align: -2px; }
    .dot.me { width: 8px; height: 8px; background: var(--accent); border: 0; box-shadow: none; }
    .dot.start { background: var(--bg); }
    .dot.user { background: #2f7cf6; border-color: #fff; box-shadow: 0 0 0 1px #2f7cf6; }
    .pulse { position: relative; width: 0; height: 0; }
    .pulse::before, .pulse::after { content: ""; position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid var(--accent); opacity: 0; animation: bam 2s ease-out infinite; }
    .pulse::after { animation-delay: 1s; }
    @keyframes bam { 0% { transform: scale(.3); opacity: .8; } 100% { transform: scale(4); opacity: 0; } }
    .route-line { filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    body.dark .route-line { stroke: #eee; }
    button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-bar a { background: var(--bg); color: var(--ink); border-bottom-color: var(--line); }
    .leaflet-control-attribution { background: rgba(250,250,250,.8) !important; color: var(--muted); font-size: 10px; }
    .leaflet-control-attribution a { color: inherit; }
    body.dark .leaflet-control-attribution { background: rgba(18,18,18,.8) !important; }
    .leaflet-tooltip { background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; box-shadow: none; }
    .leaflet-tooltip-top::before { border-top-color: var(--ink); }

    /* ефекти */
    header, #side { animation: rise .6s ease-out both; } #side { animation-delay: .1s; }
    #load { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat; background-size: 40% 100%; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    .leaflet-tile-pane { transition: filter .5s; }
    .pin { position: relative; animation: pinpop .5s cubic-bezier(.2,1.6,.4,1) backwards; animation-delay: var(--d, 0s); }
    @keyframes pinpop { from { transform: scale(0) translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .pin.sel::after, .dot.me::after { content: ""; position: absolute; inset: -1.5px; border-radius: 50%; border: 1.5px solid var(--accent); animation: ring 1.6s ease-out infinite; }
    .dot.me { position: relative; } .dot.me::after { inset: -4px; border: 0; background: var(--accent); opacity: .3; animation-duration: 1.2s; }
    @keyframes ring { to { transform: scale(2.3); opacity: 0; } }
    .route-flow { animation: flow 1.2s linear infinite; } @keyframes flow { to { stroke-dashoffset: -15; } }
    .item { transition: transform .2s; } .item:hover { transform: translateX(5px); }
    @media (pointer: coarse) { .item:hover { transform: none; } .item:active { background: var(--line); } }
    .pop { display: inline-block; animation: heart .5s cubic-bezier(.2,1.8,.4,1); } @keyframes heart { 40% { transform: scale(1.7); } }
    #detail.enter > * { animation: rise .45s ease-out both; }
    #chips button { position: relative; overflow: hidden; } #chips button:hover { transform: translateY(-1px); }
    .rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; transform: scale(0); animation: rip .6s ease-out forwards; pointer-events: none; }
    @keyframes rip { to { transform: scale(1); opacity: 0; } }
    #rnd.spin { animation: wob .3s ease-in-out infinite; } @keyframes wob { 50% { transform: rotate(-4deg) scale(1.08); } }
    @media (prefers-reduced-motion: reduce) {
      .pulse::before, .pulse::after, .item, #detail, header, #side, .pin, .pin::after, .dot.me::after, .route-flow, #load, .rip, .pop, #detail.enter > *, .fab svg { animation: none !important; }
      .item, #side, .fabs, .toast { transition: none !important; } .pulse::before, .pulse::after { opacity: .4; }
    }

    /* ================= ефекти v2 ================= */
    /* поява сторінки: карта «розкривається» колом, шапка й панель в'їжджають */
    @keyframes mapin { from { clip-path: circle(0% at 50% 60%); opacity: .4; } to { clip-path: circle(150% at 50% 60%); opacity: 1; } }
    #map { animation: mapin 1.3s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes hdrin { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
    header { animation: hdrin .6s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes sheetin { from { transform: translateY(45%); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sheetinX { from { transform: translateX(-36px); opacity: 0; } to { transform: none; opacity: 1; } }
    #side { animation: sheetin .85s cubic-bezier(.2,1.1,.3,1) .15s backwards; }
    @media (min-width: 800px) { #side { animation-name: sheetinX; } }
    @keyframes fabin { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .fab { animation: fabin .6s cubic-bezier(.2,1.6,.4,1) backwards; }
    .fab:nth-child(1) { animation-delay: .7s; } .fab:nth-child(2) { animation-delay: .8s; }

    /* перехід список ⇄ деталі: слайд убік */
    @keyframes slideFwd { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes slideBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
    #detail { animation: slideFwd .4s cubic-bezier(.2,.8,.2,1) backwards; }
    #top, #bar, #list { animation: slideBack .4s cubic-bezier(.2,.8,.2,1) backwards; }

    /* елементи списку: м'яке «проявлення» з розфокусом (backwards — щоб працював hover) */
    @keyframes itemin { from { opacity: 0; transform: translateY(10px) scale(.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
    .item { animation: itemin .5s cubic-bezier(.2,.8,.2,1) backwards; }

    /* маркер вибраного місця «підстрибує» */
    @keyframes selpop { 0% { transform: scale(.7) translateY(0); } 35% { transform: scale(1.55) translateY(-12px); } 65% { transform: scale(1.1) translateY(2px); } 100% { transform: scale(1.2); } }
    .pin.sel { animation: selpop .65s cubic-bezier(.3,1.4,.5,1) 0s; }

    /* маршрут: м'яке світіння та хвиля прибуття */
    .route-glow { animation: glowin .8s ease-out both; }
    @keyframes glowin { from { opacity: 0; } to { opacity: .3; } }
    .arrive { position: relative; width: 0; height: 0; }
    .arrive::before { content: ""; position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); opacity: .5; animation: arrive 1.2s ease-out forwards; }
    @keyframes arrive { to { transform: scale(2.8); opacity: 0; } }

    /* чіпи: пружинний «клік» */
    #chips button { transition: background .25s, color .25s, border-color .25s, transform .2s cubic-bezier(.2,1.6,.4,1); }
    @keyframes chipbounce { 0% { transform: scale(.9); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    #chips button.bounce { animation: chipbounce .4s cubic-bezier(.2,1.6,.4,1); }

    /* «збережене»: серце та іскри */
    .item .f { display: inline-grid; place-items: center; }
    .f, #fv { position: relative; } #fv { display: inline-block; }
    .pop { animation: heart .5s cubic-bezier(.2,1.8,.4,1); display: revert; }
    .item .f.pop { display: inline-grid; } #fv.pop { display: inline-block; }
    .spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; animation: spark .6s ease-out forwards; }
    @keyframes spark { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.2); opacity: 0; } }

    /* текст маршруту та тости */
    @keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .swap { animation: swap .4s ease-out; }
    .toast { transform: translate(-50%, -16px) scale(.9); transition: opacity .25s, transform .5s cubic-bezier(.2,1.5,.4,1); }
    .toast.on { transform: translate(-50%, 0) scale(1); }

    /* зміна теми: коло розходиться від кнопки (View Transitions) */
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(root) { z-index: 1; } ::view-transition-new(root) { z-index: 2; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Аляска · Тернопіль — куди піти</h1>
    <div class="tools">
      <button class="link tb" id="rnd" type="button" aria-label="Здивуй мене"><i data-ic="dice"></i><span>Здивуй мене</span></button>
      <button class="link tb" id="me" type="button" aria-label="Моя позиція як старт"><i data-ic="locate"></i><span>Моя позиція як старт</span></button>
      <button class="link tb" id="theme" type="button" aria-label="Змінити тему"><i id="ti"></i><span id="tl">Темна</span></button>
    </div>
  </header>
  <div id="load"></div>
  <main id="main">
    <div id="map" role="application" aria-label="Карта"></div>
    <section id="side" aria-label="Список місць">
      <div id="grab" role="button" tabindex="0" aria-label="Змінити висоту панелі"></div>
      <div id="top">
        <input id="q" type="search" placeholder="Пошук місць  ( / )" autocomplete="off" enterkeyhint="search" aria-label="Пошук">
        <div id="chips"></div>
      </div>
      <div id="bar"><span id="count" aria-live="polite">Завантажую місця…</span><button class="link" id="sort" type="button">Ближчі</button></div>
      <div id="list"></div>
      <div id="detail"></div>
    </section>
    <div class="fabs">
      <button class="fab" id="home" type="button" aria-label="До району" data-ic="home"></button>
      <button class="fab" id="loc" type="button" aria-label="Моя позиція" data-ic="locate"></button>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script>
    const CENTER = [49.564, 25.618], AREAS = [327955987];  // AREAS — id мікрорайону №12 «Аляска» в OpenStreetMap (можна додати кілька)
    const OVPS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
    let start = CENTER, userStart = false, areaBounds = null;
    const CATS = { eat: 'Поїсти', cafe: 'Кав\'ярні', bar: 'Бари', walk: 'Погуляти', see: 'Побачити', shop: 'Магазини' };
    const MODES = { foot: ['Пішки', 'routed-foot', 'walking'], bike: ['Велосипед', 'routed-bike', 'bicycling'], car: ['Авто', 'routed-car', 'driving'] };

    function render() {
      const r = visible(), ids = new Set(r.map(i => i.id));
      items.forEach(i => { if (ids.has(i.id)) group.addLayer(i.m); else group.removeLayer(i.m); paint(i); });
      setCount(r.length);
      $('sort').textContent = sortBy === 'dist' ? 'Ближчі' : 'А–Я';
      $('list').innerHTML = r.length ? r.slice(0, limit).map((i, k) => `
        <div class="item" data-id="${esc(i.id)}" style="animation-delay:${Math.min(k, 12) * 25}ms" tabindex="0" role="button">
          <div><b>${esc(i.name)}</b><small>${CATS[i.cat]} · ${fmt(dist(i))} · ~${walkMin(i)} хв пішки${i.hours && openNow(i.hours) != null ? ' · ' + stHtml(openNow(i.hours)) : ''}</small></div>
          <button class="link f" data-f="${esc(i.id)}" type="button" aria-label="Зберегти">${fav.has(i.id) ? '♥' : '♡'}</button>
        </div>`).join('') + (r.length > limit ? '<button class="link empty" id="more" type="button">Показати ще</button>' : '')
        : `<div class="empty">${filter === 'fav' ? 'Збережених місць ще немає — натисніть ♡ біля будь-якого.' : 'Нічого не знайдено.'}</div>`;
    }

    $('list').addEventListener('click', e => {
      const f = e.target.closest('[data-f]');
      if (f) { e.stopPropagation(); toggleFav(f.dataset.f); return; }
      if (e.target.id === 'more') { limit += 40; render(); return; }
      const it = e.target.closest('.item'); if (it) select(it.dataset.id);
    });
    $('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.id) select(e.target.dataset.id); });
    $('list').addEventListener('mouseover', e => { const el = e.target.closest('.item'), it = el && byId(el.dataset.id); if (it && it.m._map) { hov(it, 1); it.m.openTooltip(); } });
    $('list').addEventListener('mouseout', e => { const el = e.target.closest('.item'), it = el && byId(el.dataset.id); if (it && it.m._map) { hov(it, 0); it.m.closeTooltip(); } });

    function burst(el) {
      if (reduce || !el) return;
      for (let i = 0; i < 8; i++) {
        const s = document.createElement('i'), a = i / 8 * Math.PI * 2 + Math.random() * .4, r = 18 + Math.random() * 12;
        s.className = 'spark'; s.style.setProperty('--x', Math.cos(a) * r + 'px'); s.style.setProperty('--y', Math.sin(a) * r + 'px');
        s.style.background = i % 2 ? 'var(--accent)' : '#ffb020'; el.appendChild(s); setTimeout(() => s.remove(), 650);
      }
    }
    function toggleFav(id) {
      const added = !fav.has(id);
      added ? fav.add(id) : fav.delete(id); store.set('fav', [...fav]);
      render(); if (sel) renderDetail();
      document.querySelectorAll(`[data-f="${id}"], #fv`).forEach(b => { b.classList.add('pop'); if (added) burst(b); });
    }

    /* чіпи */
    [['all', 'Усе'], ['open', 'Відкрито зараз'], ...Object.entries(CATS), ['fav', '♥ Збережене']].forEach(([k, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.innerHTML = (IC[k] ? ico(k, 14) + ' ' : '') + t; b.dataset.k = k;
      if (k === 'all') b.className = 'active';
      b.onclick = e => { rip(b, e); b.classList.remove('bounce'); void b.offsetWidth; b.classList.add('bounce'); filter = k; limit = 40; document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('active', x === b)); closeDetail(); render(); $('list').scrollTop = 0; };
      $('chips').appendChild(b);
    });
    $('q').oninput = debounce(e => { query = e.target.value; limit = 40; closeDetail(); render(); }, 120);
    $('q').onfocus = () => { if (mq.matches && snap === 'peek') setSheet('half'); };
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('q').blur(); });
    $('sort').onclick = () => { sortBy = sortBy === 'dist' ? 'name' : 'dist'; render(); };

    /* деталі */
    function renderDetail() {
      const it = sel, gm = `https://www.google.com/maps/dir/?api=1&origin=${start[0]},${start[1]}&destination=${it.coords[0]},${it.coords[1]}&travelmode=${MODES[mode][2]}`;
      const st = openNow(it.hours);
      const rows = [['Адреса', esc(it.addr)], ['Кухня', esc(it.cuisine)], ['Години', it.hours ? esc(it.hours) + (st == null ? '' : ' · ' + stHtml(st)) : ''],
        ['Телефон', it.phone ? `<a class="link act" href="tel:${esc(String(it.phone).replace(/[^\d+]/g, ''))}">${esc(it.phone)}</a>` : ''],
        ['Сайт', it.web ? `<a class="link act" href="${esc(it.web)}" target="_blank" rel="noopener">${esc(it.web.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>` : '']];
      const kv = rows.filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('');
      const rt = $('rt') ? $('rt').textContent : 'Прокладаю маршрут…';
      $('detail').innerHTML = `
        <button class="link" id="back" type="button">← Усі місця</button>
        <h2>${esc(it.name)}</h2>
        <div class="sub">${CATS[it.cat]} · ${fmt(dist(it))} по прямій${it.desc ? ' · добірка' : ''}</div>
        ${it.desc ? `<p>${esc(it.desc)}</p>${it.facts.length ? `<ul>${it.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}` : ''}
        ${kv ? `<dl class="kv">${kv}</dl>` : ''}
        <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="link act${k === mode ? ' on' : ''}" data-m="${k}" type="button">${m[0]}</button>`).join('')}</div>
        <div class="sub" id="rt">${esc(rt)}</div>
        <div class="acts">
          <button class="link act" id="fv" type="button">${fav.has(it.id) ? '♥ Збережено' : '♡ Зберегти'}</button>
          <a class="link act" href="${gm}" target="_blank" rel="noopener">Google Maps</a>
          <button class="link act" id="sh" type="button">Поділитись</button>
        </div>`;
      $('back').onclick = closeDetail; $('fv').onclick = () => toggleFav(it.id);
      $('sh').onclick = async () => {
        const u = location.href.split('#')[0] + '#p=' + it.id;
        try { if (navigator.share) { await navigator.share({ title: it.name, text: it.name + ' — Аляска, Тернопіль', url: u }); return; } } catch (e) { if (e.name === 'AbortError') return; }
        try { await navigator.clipboard.writeText(u); toast('Посилання скопійовано'); } catch (e) { toast(u); }
      };
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; route(it); renderDetail(); });
    }

    function clearRoute() {
      token++; clearTimeout(drawTimer);
      [routeGlow, routeLine, routeFlow, walker, pulse].forEach(l => l && map.removeLayer(l)); routeGlow = routeLine = routeFlow = walker = pulse = null;
      if (routeControl) { map.removeControl(routeControl); routeControl = null; }
    }
    function closeDetail() {
      if (!sel) return;
      const prev = sel; sel = null; clearRoute(); paint(prev);
      side.classList.remove('open'); history.replaceState(null, '', location.pathname + location.search);
    }
    function select(id) {
      const it = byId(id); if (!it) return;
      const prev = sel; sel = it; prev && paint(prev);
      if (!it.m._map) group.addLayer(it.m);
      paint(it); side.classList.add('open'); $('detail').scrollTop = 0;
      if (mq.matches && snap !== 'half') setSheet('half');
      history.replaceState(null, '', '#p=' + id);
      $('detail').innerHTML = ''; renderDetail();
      const d = $('detail'); [...d.children].forEach((c, i) => c.style.animationDelay = i * 60 + 'ms'); d.classList.add('enter'); setTimeout(() => d.classList.remove('enter'), 900);
      route(it);
    }

    /* маршрут */
    function runWalker(c, my) {
      walker = L.marker(c[0], { icon: dotIcon('me'), interactive: false, zIndexOffset: 900 }).addTo(map);
      if (reduce) return walker.setLatLng(c[c.length - 1]);
      const cum = [0]; for (let i = 1; i < c.length; i++) cum[i] = cum[i - 1] + map.distance(c[i - 1], c[i]);
      const tot = cum[cum.length - 1] || 1, ms = Math.min(6000, Math.max(2000, tot * 4)), t0 = performance.now(); let s = 1;
      (function f(now) {
        if (my !== token || !walker) return;
        const t = Math.min((now - t0) / ms, 1), d = easeIO(t) * tot;
        while (s < cum.length - 1 && cum[s] < d) s++;
        const k = (d - cum[s - 1]) / ((cum[s] - cum[s - 1]) || 1), a = c[s - 1], b = c[s];
        walker.setLatLng([a.lat + (b.lat - a.lat) * k, a.lng + (b.lng - a.lng) * k]);
        if (t < 1) requestAnimationFrame(f); else arrive(c[c.length - 1], my);
      })(t0);
    }
    function flow(c) { routeFlow = L.polyline(c, { color: '#e5484d', weight: 2.5, opacity: .9, dashArray: '1 14', lineCap: 'round', interactive: false, className: 'route-flow' }).addTo(map); }
    function drawRoute(c, my, done) {
      if (my !== token) return;
      routeGlow = L.polyline(c, { color: '#e5484d', weight: coarse ? 14 : 12, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, className: 'route-glow' }).addTo(map);
      routeLine = L.polyline(c, { color: '#111', weight: coarse ? 5 : 4, opacity: .85, lineCap: 'round', lineJoin: 'round', className: 'route-line' }).addTo(map);
      const p = routeLine.getElement();
      if (reduce || !p || !p.getTotalLength) { flow(c); return done(); }
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect();
      p.style.transition = 'stroke-dashoffset 1s ease-in-out'; p.style.strokeDashoffset = 0;
      p.addEventListener('transitionend', () => { p.style.strokeDasharray = 'none'; if (my === token) flow(c); done(); }, { once: true });
    }
    function say(t) { const el = $('rt'); if (!el) return; el.textContent = t; el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
    function arrive(ll, my) {
      if (my !== token) return;
      const m = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="arrive"></div>', iconSize: [0, 0] }), interactive: false }).addTo(map);
      setTimeout(() => map.removeLayer(m), 1300);
    }
    function route(it) {
      clearRoute(); const my = token;
      pulse = L.marker(it.coords, { icon: L.divIcon({ className: '', html: '<div class="pulse"></div>', iconSize: [0, 0] }), interactive: false }).addTo(map);
      focusOn(it.coords, Math.max(map.getZoom(), 16));
      say('Прокладаю маршрут…');
      routeControl = L.Routing.control({
        waypoints: [L.latLng(start), L.latLng(it.coords)],
        router: L.Routing.osrmv1({ serviceUrl: `https://routing.openstreetmap.de/${MODES[mode][1]}/route/v1` }),
        addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: false, show: false, createMarker: () => null,
        lineOptions: { styles: [{ opacity: 0, weight: 1 }] }
      }).on('routesfound', e => {
        if (my !== token) return;
        const r = e.routes[0];
        map.flyToBounds(L.latLngBounds(r.coordinates).extend(it.coords), { ...fitOpts(40), duration: reduce ? 0 : 1.2, maxZoom: 17 });
        let drawn = false; const go = () => { if (drawn || my !== token) return; drawn = true; drawRoute(r.coordinates, my, () => my === token && runWalker(r.coordinates, my)); };
        map.once('moveend', go); drawTimer = setTimeout(go, 1500);
        say(`${MODES[mode][0]}: ${(r.summary.totalDistance / 1000).toFixed(1)} км, ${Math.max(1, Math.round(r.summary.totalTime / 60))} хв`);
      }).on('routingerror', () => say(navigator.onLine ? 'Не вдалося прокласти маршрут. Спробуйте ще раз.' : 'Немає з\'єднання з інтернетом.')).addTo(map);
    }

    /* геолокація */
    function locate(asStart) {
      if (!navigator.geolocation) return toast('Геолокація недоступна в цьому браузері');
      const btns = [$('loc'), $('me')]; btns.forEach(b => b.setAttribute('data-busy', ''));
      navigator.geolocation.getCurrentPosition(p => {
        btns.forEach(b => b.removeAttribute('data-busy'));
        const ll = [p.coords.latitude, p.coords.longitude];
        if (!userMarker) userMarker = L.marker(ll, { icon: dotIcon('user'), interactive: false, zIndexOffset: 800 }).addTo(map); else userMarker.setLatLng(ll);
        if (asStart) { userStart = true; start = ll; startMarker.setLatLng(start); render(); sel ? (renderDetail(), route(sel)) : focusOn(ll, 16); toast('Старт — ваша позиція'); }
        else focusOn(ll, 16);
      }, err => { btns.forEach(b => b.removeAttribute('data-busy')); toast(err.code === 1 ? 'Дозвольте доступ до геолокації в налаштуваннях браузера' : 'Не вдалося визначити позицію'); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
    }
    $('me').onclick = () => locate(true);
    $('loc').onclick = () => locate(false);
    $('home').onclick = () => { if (areaBounds) map.flyToBounds(areaBounds, { ...fitOpts(30), duration: reduce ? 0 : 1 }); else focusOn(CENTER, 15); };

    /* випадкове місце */
    let spinning = false;
    $('rnd').onclick = () => {
      const r = visible(); if (!r.length || spinning) return;
      const pick = r[Math.floor(Math.random() * r.length)];
      if (reduce || r.length < 3) return select(pick.id);
      spinning = true; closeDetail(); $('rnd').classList.add('spin'); let prev = null, n = 0;
      (function step() {
        if (prev && prev.m._map) { hov(prev, 0); prev.m.closeTooltip(); }
        if (n++ >= 12) { spinning = false; $('rnd').classList.remove('spin'); select(pick.id); return; }
        prev = r[Math.floor(Math.random() * r.length)]; hov(prev, 1); prev.m.openTooltip();
        setTimeout(step, 50 + n * 14);
      })();
    };
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); closeDetail(); $('q').focus(); }
      else if (e.key === 'Escape') { sel ? closeDetail() : $('q').blur(); }
    });
    addEventListener('offline', () => toast('Немає з\'єднання з інтернетом'));
    addEventListener('online', () => toast('З\'єднання відновлено'));
    addEventListener('hashchange', () => { const h = location.hash.match(/p=([\w-]+)/); if (h && byId(h[1]) && (!sel || sel.id !== h[1])) select(h[1]); });

    /* дані: добірка + OpenStreetMap (Overpass) */
    function setItems(osm) {
      const cur = CURATED.map(c => {
        const o = c.snap && osm.find(x => c.snap.test(x.name) && map.distance(x.coords, c.coords) < 3000);
        return { ...c, coords: o ? o.coords : c.coords };
      });
      const rest = osm.filter(o => !cur.some(c => map.distance(c.coords, o.coords) < 60 && (c.cat === o.cat || o.name.toLowerCase().includes(c.name.split(' ').pop().toLowerCase()))));
      items.forEach(i => i.m && group.removeLayer(i.m));
      items = [...cur, ...rest]; items.forEach((it, i) => { it._i = i; mk(it); });
      if (sel) { const s2 = byId(sel.id); if (s2) { sel = s2; } else { sel = null; side.classList.remove('open'); clearRoute(); } }
      render(); if (sel) paint(sel);
      const h = location.hash.match(/p=([\w-]+)/); if (h && byId(h[1]) && !sel) select(h[1]);
    }
    setItems([]);

    async function ovp(q) {
      let err;
      for (const u of OVPS) {
        const ac = new AbortController(), t = setTimeout(() => ac.abort(), 20000);
        try { const r = await fetch(u, { method: 'POST', body: 'data=' + encodeURIComponent(q), signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
        catch (e) { err = e; } finally { clearTimeout(t); }
      }
      throw err;
    }
    async function loadBoundary() {
      try {
        let ways = cache.get('osm-bound-v3', 30 * 864e5);
        if (!ways) {
          const j = await ovp(`[out:json][timeout:25];rel(id:${AREAS});out geom;`);
          ways = j.elements.flatMap(rel => (rel.members || []).filter(m => m.type === 'way' && m.geometry).map(m => m.geometry.map(g => [g.lat, g.lon])));
          if (ways.length) cache.set('osm-bound-v3', ways);
        }
        if (!ways.length) return;
        ways.forEach(w => L.polyline(w, { color: '#e5484d', weight: 2, dashArray: '6 6', interactive: false }).addTo(map));
        areaBounds = L.latLngBounds(ways.flat());
        if (!userStart) { const c = areaBounds.getCenter(); start = [c.lat, c.lng]; startMarker.setLatLng(start); render(); }
        if (!sel) map.flyToBounds(areaBounds, { ...fitOpts(30), duration: reduce ? 0 : 1.4 });
      } catch (e) {}
    }
    const Q = `[out:json][timeout:25];rel(id:${AREAS});map_to_area->.a;(nwr[amenity~"^(restaurant|fast_food|cafe|bar|pub)$"][name](area.a);nwr[leisure~"^(park|garden)$"][name](area.a);nwr[tourism~"^(museum|gallery|attraction|viewpoint)$"][name](area.a);nwr[historic~"^(castle|monument|ruins|fort|archaeological_site|building)$"][name](area.a);nwr[shop~"^(supermarket|mall|convenience|bakery|department_store)$"][name](area.a););out center tags 600;`;
    async function loadPlaces() {
      $('count').textContent = 'Завантажую місця…';
      if (!$('load')) { const l = document.createElement('div'); l.id = 'load'; document.querySelector('header').after(l); }
      let data = cache.get('osm-aliaska-v3', 12 * 36e5);
      if (!data) {
        try { data = (await ovp(Q)).elements; cache.set('osm-aliaska-v3', data); }
        catch (e) {
          $('load') && $('load').remove(); shown = 0;
          $('count').innerHTML = 'Не вдалося завантажити місця. <button class="link" id="retry" type="button">Повторити</button>';
          $('retry').onclick = loadPlaces; return;
        }
      }
      $('load') && $('load').remove(); setItems(data.map(fromOSM).filter(Boolean));
    }
    loadPlaces().then(loadBoundary);
  </script>
</body>
</html>
