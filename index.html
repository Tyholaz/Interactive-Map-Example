<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Аляска, Тернопіль — куди піти</title>
  <meta name="description" content="Де поїсти, де погуляти і що побачити в районі Аляска у Тернополі: інтерактивна карта з маршрутами.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <style>
    :root { --bg:#fafafa; --ink:#111; --muted:#777; --line:#e4e4e4; --accent:#e5484d; }
    body.dark { --bg:#121212; --ink:#eee; --muted:#8a8a8a; --line:#2a2a2a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: background .3s, color .3s; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
      padding: 14px 20px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
    .tools { display: flex; gap: 16px; flex-wrap: wrap; }
    .link { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px; text-decoration-color: var(--line); transition: color .15s; }
    .link:hover, .link.on { color: var(--ink); }
    .link.on { text-decoration-color: var(--ink); }

    main { flex: 1; min-height: 0; display: grid; grid-template-rows: 40% 1fr; }
    @media (min-width: 800px) { #chips { flex-wrap: wrap; overflow: visible; } main { grid-template-columns: 400px 1fr; grid-template-rows: 1fr; } #map { order: 2; } }
    #map { background: #f0f0f0; min-height: 0; }
    body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9); }

    #side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
    #top { padding: 14px 20px 10px; }
    #q { width: 100%; padding: 9px 14px; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; outline: 0; transition: border-color .15s; }
    #q:focus { border-color: var(--ink); }
    #chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
    #chips::-webkit-scrollbar { display: none; }
    #chips button { flex: none; padding: 5px 14px; font: inherit; font-size: 14px; color: var(--ink); background: transparent;
      border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: .15s; }
    #chips button:hover { border-color: var(--ink); }
    #chips button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    #chips button:active { transform: scale(.96); }
    #bar { display: flex; justify-content: space-between; padding: 6px 20px; color: var(--muted); font-size: 13px; }

    #list { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
    .item { padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; justify-content: space-between; gap: 12px; animation: rise .35s ease-out both; }
    .item:hover b { text-decoration: underline; text-underline-offset: 3px; }
    .item small { display: block; color: var(--muted); }
    .item .f { align-self: flex-start; }
    .empty { color: var(--muted); padding: 24px 0; }

    #detail { display: none; flex: 1; overflow-y: auto; padding: 14px 20px 24px; animation: rise .35s ease-out both; }
    #side.open #detail { display: block; }
    #side.open #top, #side.open #bar, #side.open #list { display: none; }
    #detail h2 { margin: 14px 0 0; font-size: 22px; letter-spacing: -.01em; line-height: 1.2; }
    .sub { color: var(--muted); font-size: 14px; }
    #detail ul { margin: 8px 0; padding-left: 18px; color: var(--muted); }
    .kv { margin: 14px 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
    .acts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; }
    .modes { display: flex; gap: 14px; margin: 12px 0 4px; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--ink); }
    .pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      border: 1.5px solid var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.2); transition: transform .15s, background .15s, color .15s, border-color .15s; }
    .pin svg { width: 15px; height: 15px; }
    .pin:hover, .pin.hov { transform: scale(1.2); }
    .pin.fav { border-color: var(--accent); color: var(--accent); }
    .pin.sel { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.2); }
    #chips svg { vertical-align: -2px; }
    .dot.me { width: 8px; height: 8px; background: var(--accent); border: 0; box-shadow: none; }
    .dot.start { background: var(--bg); }
    .pulse { position: relative; width: 0; height: 0; }
    .pulse::before, .pulse::after { content: ""; position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid var(--accent); opacity: 0; animation: bam 2s ease-out infinite; }
    .pulse::after { animation-delay: 1s; }
    @keyframes bam { 0% { transform: scale(.3); opacity: .8; } 100% { transform: scale(4); opacity: 0; } }
    .route-line { filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
    body.dark .route-line { stroke: #eee; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    .leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-bar a { background: var(--bg); color: var(--ink); border-bottom-color: var(--line); }
    .leaflet-control-attribution { background: rgba(250,250,250,.8) !important; color: var(--muted); font-size: 10px; }
    .leaflet-tooltip { background: var(--ink); color: var(--bg); border: 0; border-radius: 6px; box-shadow: none; }
    .leaflet-tooltip-top::before { border-top-color: var(--ink); }
    /* ефекти */
    header, #side { animation: rise .6s ease-out both; } #side { animation-delay: .1s; }
    #load { height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent) no-repeat; background-size: 40% 100%; animation: load 1.1s ease-in-out infinite; }
    @keyframes load { from { background-position: -40% 0; } to { background-position: 140% 0; } }
    .leaflet-tile-pane { transition: filter .5s; }
    .pin { position: relative; animation: pinpop .5s cubic-bezier(.2,1.6,.4,1) backwards; animation-delay: var(--d, 0s); }
    @keyframes pinpop { from { transform: scale(0) translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .pin.sel::after, .dot.me::after { content: ""; position: absolute; inset: -1.5px; border-radius: 50%; border: 1.5px solid var(--accent); animation: ring 1.6s ease-out infinite; }
    .dot.me { position: relative; } .dot.me::after { inset: -4px; border: 0; background: var(--accent); opacity: .3; animation-duration: 1.2s; }
    @keyframes ring { to { transform: scale(2.3); opacity: 0; } }
    .route-flow { animation: flow 1.2s linear infinite; } @keyframes flow { to { stroke-dashoffset: -15; } }
    .item { transition: transform .2s; } .item:hover { transform: translateX(5px); }
    .pop { display: inline-block; animation: heart .5s cubic-bezier(.2,1.8,.4,1); } @keyframes heart { 40% { transform: scale(1.7); } }
    #detail.enter > * { animation: rise .45s ease-out both; }
    #chips button { position: relative; overflow: hidden; } #chips button:hover { transform: translateY(-1px); }
    .rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; transform: scale(0); animation: rip .6s ease-out forwards; pointer-events: none; }
    @keyframes rip { to { transform: scale(1); opacity: 0; } }
    #rnd.spin { animation: wob .3s ease-in-out infinite; } @keyframes wob { 50% { transform: rotate(-4deg) scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .pulse::before, .pulse::after, .item, #detail, header, #side, .pin, .pin::after, .dot.me::after, .route-flow, #load, .rip, .pop, #detail.enter > * { animation: none !important; } .item { transition: none; } .pulse::before, .pulse::after { opacity: .4; } }
  </style>
</head>
<body>
  <header>
    <h1>Аляска, Тернопіль — куди піти</h1>
    <div class="tools">
      <button class="link" id="rnd" type="button">Здивуй мене</button>
      <button class="link" id="me" type="button">Моя позиція як старт</button>
      <button class="link" id="theme" type="button">Темна</button>
    </div>
  </header>
  <div id="load"></div>
  <main>
    <section id="side">
      <div id="top">
        <input id="q" type="search" placeholder="Пошук місць  ( / )" autocomplete="off" aria-label="Пошук">
        <div id="chips"></div>
      </div>
      <div id="bar"><span id="count">Завантажую місця…</span><button class="link" id="sort" type="button">Ближчі</button></div>
      <div id="list"></div>
      <div id="detail"></div>
    </section>
    <div id="map"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script>
    const CENTER = [49.564, 25.618], AREAS = [327955987], OVP = 'https://overpass-api.de/api/interpreter';  // AREAS — id мікрорайону №12 «Аляска» в OpenStreetMap (можна додати кілька)
    let start = CENTER, userStart = false;
    const CATS = { eat: 'Поїсти', cafe: 'Кав\'ярні', bar: 'Бари', walk: 'Погуляти', see: 'Побачити', shop: 'Магазини' };
    const MODES = { foot: ['Пішки', 'routed-foot', 'walking'], bike: ['Велосипед', 'routed-bike', 'bicycling'], car: ['Авто', 'routed-car', 'driving'] };
    let mode = 'foot';

    /* Власна добірка: { id, name, cat: 'eat|cafe|bar|walk|see|shop', coords: [lat, lng], desc, facts: [], addr, snap (RegExp — підтягує координати з OSM) }
       Координати більшості місць наближені (за номерами будинків) — за потреби поправте coords. */
    const MALL = [49.5752, 25.6388], J = n => [MALL[0] + (n % 4 - 1.5) * 0.00012, MALL[1] + (Math.floor(n / 4) - 1.5) * 0.00018];
    const CURATED = [
      { id: 'c-podolyany', name: 'ТРЦ «Подоляни»', cat: 'shop', coords: MALL, snap: /подоляни/i, addr: 'вул. Текстильна, 28ч',
        desc: 'Найбільший торгово-розважальний центр Тернополя біля об\'їзної: магазини, їжа й розваги під одним дахом.',
        facts: ['Відкритий у 2007 році', 'Близько 50 тис. м², паркінг на ~1800 місць', 'Сільпо, Фокстрот, LC Waikiki, Reserved, Sinsay, Intersport та інші'] },
      { id: 'c-mall2', name: 'Подоляни Mall (нова черга)', cat: 'shop', coords: J(1), addr: 'вул. Текстильна, 28ч',
        desc: 'Нова будівля комплексу з панорамним фудкортом.',
        facts: ['Анонсовані KFC (перший у Тернополі), «Чорноморка», Pepco, New Yorker, CCC', 'Розважальний центр FlyKids', 'Відкриття було заплановане на 15 жовтня 2026 — перевірте, чи вже працює'] },
      { id: 'c-eskimos', name: 'Льодовий центр «Ескімос»', cat: 'see', coords: J(2), addr: 'ТРЦ «Подоляни»',
        desc: 'Всесезонний льодовий центр у «Подолянах».', facts: ['За даними сайту ТРЦ — єдиний у місті всесезонний'] },
      { id: 'c-silver', name: 'Більярд-боулінг клуб «Silver»', cat: 'see', coords: J(3), addr: 'ТРЦ «Подоляни»',
        desc: 'Боулінг і більярд для компанії.', facts: ['За даними сайту ТРЦ — найбільший у місті більярд-боулінг клуб'] },
      { id: 'c-miromax', name: 'Кінотеатр MiroMax', cat: 'see', coords: J(4), addr: 'ТРЦ «Подоляни»',
        desc: 'Багатозальний кінотеатр у торговому центрі.', facts: ['Поруч також 5D та 7D кінотеатри'] },
      { id: 'c-concert', name: 'Концерт-хол «Подоляни»', cat: 'see', coords: J(5), addr: 'ТРЦ «Подоляни»',
        desc: 'Зал для концертів, весіль, конференцій і виставок.', facts: ['Позиціонується як найбільший концерт-хол Західної України'] },
      { id: 'c-peperoni', name: 'Піцерія «Пепероні»', cat: 'eat', coords: J(6), addr: 'ТРЦ «Подоляни»', cuisine: 'італійська, піца',
        desc: 'Італійська піцерія в «Подолянах».', facts: [] },
      { id: 'c-silpo', name: 'Сільпо («Подоляни»)', cat: 'shop', coords: J(7), addr: 'ТРЦ «Подоляни»',
        desc: 'Супермаркет у торговому центрі.', facts: [] },
      { id: 'c-foxtrot', name: 'Фокстрот («Подоляни»)', cat: 'shop', coords: J(8), addr: 'ТРЦ «Подоляни»',
        desc: 'Магазин побутової техніки та електроніки.', facts: [] },
      { id: 'c-intersport', name: 'Intersport («Подоляни»)', cat: 'shop', coords: J(9), addr: 'ТРЦ «Подоляни»',
        desc: 'Спортивний одяг, взуття та інвентар.', facts: [] },
      { id: 'c-lcw', name: 'LC Waikiki («Подоляни»)', cat: 'shop', coords: J(10), addr: 'ТРЦ «Подоляни»',
        desc: 'Одяг для всієї родини.', facts: [] },
      { id: 'c-cukerka', name: 'Кав\'ярня «Цукерка»', cat: 'cafe', coords: J(11), addr: 'вул. Текстильна, 28ч',
        desc: 'Кава, десерти, свіжа випічка; є комплексні обіди та сніданки.', facts: ['Також у ТРЦ «Подоляни» діє кондитерська «Цукерка»'] },
      { id: 'c-formiya', name: 'Кав\'ярня-піцерія «Формія»', cat: 'cafe', coords: [49.5717, 25.6373], addr: 'вул. Леся Курбаса, 2а', phone: '+38 (097) 920-64-05',
        desc: 'Кав\'ярня з піцою; відгуки хвалять торти на замовлення.', facts: [] },
      { id: 'c-dali', name: 'Dali. Pizza & Sushi', cat: 'eat', coords: [49.5698, 25.6419], addr: 'бульвар Дмитра Вишневецького, 1', phone: '+38 (097) 394-72-77', cuisine: 'піца, суші',
        desc: 'Піца й суші, є бронювання столиків і доставка.', facts: [] },
      { id: 'c-atb2', name: 'АТБ (Курбаса, 2а)', cat: 'shop', coords: [49.5717, 25.6370], addr: 'вул. Леся Курбаса, 2а', hours: 'щодня 08:00–22:00',
        desc: 'Супермаркет біля початку вулиці Курбаса.', facts: [] },
      { id: 'c-smakolyk', name: 'Супермаркет «Смаколик» №10', cat: 'shop', coords: [49.5716, 25.6375], addr: 'вул. Леся Курбаса, 2а', hours: 'щодня 08:00–22:00',
        desc: 'Продуктовий супермаркет.', facts: [] },
      { id: 'c-lavash', name: 'Пекарня «Лаваш»', cat: 'cafe', coords: [49.5731, 25.6380], addr: 'вул. Леся Курбаса, 3',
        desc: 'Пекарня зі свіжим хлібом і випічкою.', facts: [] },
      { id: 'c-atb7', name: 'АТБ (Курбаса, 7)', cat: 'shop', coords: [49.5730, 25.6424], addr: 'вул. Леся Курбаса, 7', hours: 'щодня 08:00–22:00',
        desc: 'Супермаркет біля «Подолян».', facts: [] },
      { id: 'c-blyzenko', name: 'Магазин «Близенько»', cat: 'shop', coords: [49.5729, 25.6424], addr: 'вул. Леся Курбаса, 7',
        desc: 'Мережевий магазин біля дому.', facts: [] },
      { id: 'c-ioan', name: 'Храм апостола Іоана Богослова (ПЦУ)', cat: 'see', coords: [49.5721, 25.6418], addr: 'вул. Леся Курбаса, 6а',
        desc: 'Храм у самому серці району.', facts: [] },
      { id: 'c-vyshnevetskoho', name: 'Бульвар Дмитра Вишневецького', cat: 'walk', coords: [49.5708, 25.6412], addr: 'бульвар Дмитра Вишневецького',
        desc: 'Пішохідний бульвар, серце району: спокійна прогулянка між вулицями Курбаса та Симоненка.',
        facts: ['Реконструйований у 2015 році', 'Є фонтан, лавки та дитячий майданчик'] }
    ];

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

    /* тема */
    function setTheme(d) { document.body.classList.toggle('dark', d); $('theme').textContent = d ? 'Світла' : 'Темна'; store.set('dark', d); }
    setTheme(store.get('dark', matchMedia('(prefers-color-scheme: dark)').matches));
    $('theme').onclick = () => setTheme(!document.body.classList.contains('dark'));

    /* карта */
    const map = L.map('map').setView(CENTER, 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; учасники OpenStreetMap', maxZoom: 19 }).addTo(map);
    const dotIcon = c => L.divIcon({ className: '', html: `<div class="dot ${c || ''}"></div>`, iconSize: [12, 12] });
    const startMarker = L.marker(start, { icon: dotIcon('start'), zIndexOffset: -100 }).addTo(map).bindTooltip('Старт', { direction: 'top' });
    const group = L.layerGroup().addTo(map);

    /* стан */
    let items = [], filter = 'all', query = '', sortBy = 'dist', limit = 40, sel = null, fav = new Set(store.get('fav', []));
    let token = 0, routeFlow = null, routeControl = null, routeLine = null, walker = null, pulse = null, drawTimer = null;

    const dist = it => map.distance(start, it.coords);
    const fmt = m => m < 1000 ? Math.round(m / 10) * 10 + ' м' : (m / 1000).toFixed(1) + ' км';
    const byId = id => items.find(i => i.id === id);

    function catOf(t) {
      if (t.amenity === 'restaurant' || t.amenity === 'fast_food') return 'eat';
      if (t.amenity === 'cafe') return 'cafe';
      if (t.amenity === 'bar' || t.amenity === 'pub') return 'bar';
      if (t.leisure === 'park' || t.leisure === 'garden') return 'walk';
      if (t.shop) return 'shop';
      return 'see';
    }
    function fromOSM(e) {
      const t = e.tags || {}, lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon, name = t['name:uk'] || t.name;
      if (!name || lat == null) return null;
      const street = t['addr:street'] ? t['addr:street'] + (t['addr:housenumber'] ? ', ' + t['addr:housenumber'] : '') : '';
      let web = t.website || t['contact:website'] || ''; if (!/^https?:\/\//i.test(web)) web = '';
      return { id: e.type[0] + e.id, name, cat: catOf(t), coords: [lat, lon], addr: street, hours: t.opening_hours, phone: t.phone || t['contact:phone'], web, cuisine: t.cuisine && t.cuisine.replace(/[;_]/g, ', ') };
    }

    /* маркери з унікальними іконками категорій */
    const ICONS = {
      eat: '<path d="M7 3v7M4 3v4a3 3 0 0 0 3 3M10 3v4a3 3 0 0 1-3 3M7 10v11M18 3c-2.2 1.6-3 4.200-3 7h3v11"/>',
      cafe: '<path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 9h1.500a2.500 2.500 0 0 1 0 5H16M8 3v2M12 3v2"/>',
      bar: '<path d="M5 4h14l-7 8zM12 12v8M8 20h8"/>',
      walk: '<path d="M12 21v-6M12 3a5 5 0 0 0-4 8 4 4 0 0 0 1 4h6a4 4 0 0 0 1-4 5 5 0 0 0-4-8z"/>',
      see: '<path d="M3 21h18M5 10v11M9.500 10v11M14.500 10v11M19 10v11M3 10l9-6 9 6z"/>',
      shop: '<path d="M6 7h12l1 14H5zM9 7a3 3 0 0 1 6 0"/>'
    };
    const ico = (k, n) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
    const pinKey = it => (sel && sel.id === it.id ? 's' : '') + (fav.has(it.id) ? 'f' : '');
    const pinIcon = it => L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14],
      html: `<div class="pin${sel && sel.id === it.id ? ' sel' : ''}${fav.has(it.id) ? ' fav' : ''}" style="--d:${it._fresh === false ? 0 : Math.min(it._i || 0, 40) * 25}ms">${ico(it.cat, 15)}</div>` });
    function mk(it) {
      it._k = pinKey(it);
      it.m = L.marker(it.coords, { icon: pinIcon(it), keyboard: false }).bindTooltip(it.name, { direction: 'top', offset: [0, -16] });
      it._fresh = false; it.m.on('click', () => select(it.id));
    }
    function paint(it) {
      const k = pinKey(it);
      if (k !== it._k) { it._k = k; it.m.setIcon(pinIcon(it)); }
      it.m.setZIndexOffset(k.includes('s') ? 1000 : 0);
    }
    function hov(it, on) { const el = it.m.getElement(); el && el.firstChild.classList.toggle('hov', !!on); }

    /* фільтрація та список */
    function visible() {
      const q = query.trim().toLowerCase();
      let r = items.filter(i => (filter === 'all' || (filter === 'fav' ? fav.has(i.id) : i.cat === filter)) && (!q || i.name.toLowerCase().includes(q)));
      r.sort(sortBy === 'dist' ? (a, b) => dist(a) - dist(b) : (a, b) => a.name.localeCompare(b.name, 'uk'));
      return r;
    }
    let shown = 0;
    function setCount(n) {
      const from = shown, t0 = performance.now(), w = n % 10 === 1 && n % 100 !== 11 ? 'місце' : 'місць'; shown = n;
      (function f(now) { const t = reduce ? 1 : Math.min((now - t0) / 450, 1); $('count').textContent = Math.round(from + (n - from) * t) + ' ' + w; if (t < 1) requestAnimationFrame(f); })(t0);
    }
    function rip(b, e) {
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, x = e.detail ? e.clientX - r.left : r.width / 2, y = e.detail ? e.clientY - r.top : r.height / 2;
      const s = document.createElement('span'); s.className = 'rip'; s.style.cssText = `width:${d}px;height:${d}px;left:${x - d / 2}px;top:${y - d / 2}px`;
      b.appendChild(s); setTimeout(() => s.remove(), 600);
    }
    function render() {
      const r = visible(), ids = new Set(r.map(i => i.id));
      items.forEach(i => { if (ids.has(i.id)) group.addLayer(i.m); else group.removeLayer(i.m); paint(i); });
      setCount(r.length);
      $('sort').textContent = sortBy === 'dist' ? 'Ближчі' : 'А–Я';
      $('list').innerHTML = r.length ? r.slice(0, limit).map((i, k) => `
        <div class="item" data-id="${i.id}" style="animation-delay:${Math.min(k, 12) * 25}ms" tabindex="0">
          <div><b>${esc(i.name)}</b><small>${CATS[i.cat]} · ${fmt(dist(i))}</small></div>
          <button class="link f" data-f="${i.id}" type="button" aria-label="Зберегти">${fav.has(i.id) ? '♥' : '♡'}</button>
        </div>`).join('') + (r.length > limit ? '<button class="link empty" id="more" type="button">Показати ще</button>' : '')
        : '<div class="empty">Нічого не знайдено.</div>';
    }

    $('list').addEventListener('click', e => {
      const f = e.target.closest('[data-f]');
      if (f) { e.stopPropagation(); toggleFav(f.dataset.f); return; }
      if (e.target.id === 'more') { limit += 40; render(); return; }
      const it = e.target.closest('.item'); if (it) select(it.dataset.id);
    });
    $('list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.id) select(e.target.dataset.id); });
    $('list').addEventListener('mouseover', e => { const el = e.target.closest('.item'), it = el && byId(el.dataset.id); if (it && it.m._map) { hov(it, 1); it.m.openTooltip(); } });
    $('list').addEventListener('mouseout', e => { const el = e.target.closest('.item'), it = el && byId(el.dataset.id); if (it) { hov(it, 0); it.m.closeTooltip(); } });

    function toggleFav(id) {
      fav.has(id) ? fav.delete(id) : fav.add(id); store.set('fav', [...fav]);
      render(); if (sel) renderDetail();
      document.querySelectorAll(`[data-f="${id}"], #fv`).forEach(b => b.classList.add('pop'));
    }

    /* чіпи */
    [['all', 'Усе'], ...Object.entries(CATS), ['fav', '♥ Збережене']].forEach(([k, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.innerHTML = (ICONS[k] ? ico(k, 14) + ' ' : '') + t; b.dataset.k = k;
      if (k === 'all') b.className = 'active';
      b.onclick = e => { rip(b, e); filter = k; limit = 40; document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('active', x === b)); closeDetail(); render(); };
      $('chips').appendChild(b);
    });
    $('q').oninput = e => { query = e.target.value; limit = 40; closeDetail(); render(); };
    $('sort').onclick = () => { sortBy = sortBy === 'dist' ? 'name' : 'dist'; render(); };

    /* деталі */
    function renderDetail() {
      const it = sel, gm = `https://www.google.com/maps/dir/?api=1&origin=${start[0]},${start[1]}&destination=${it.coords[0]},${it.coords[1]}&travelmode=${MODES[mode][2]}`;
      const kv = [['Адреса', it.addr], ['Кухня', it.cuisine], ['Години', it.hours], ['Телефон', it.phone]].filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')
        + (it.web ? `<dt>Сайт</dt><dd><a class="link" href="${esc(it.web)}" target="_blank" rel="noopener">${esc(it.web.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a></dd>` : '');
      const rt = $('rt') ? $('rt').textContent : 'Прокладаю маршрут…';
      $('detail').innerHTML = `
        <button class="link" id="back" type="button">← Усі місця</button>
        <h2>${esc(it.name)}</h2>
        <div class="sub">${CATS[it.cat]} · ${fmt(dist(it))} по прямій${it.desc ? ' · добірка' : ''}</div>
        ${it.desc ? `<p>${esc(it.desc)}</p><ul>${it.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
        ${kv ? `<dl class="kv">${kv}</dl>` : ''}
        <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="link${k === mode ? ' on' : ''}" data-m="${k}" type="button">${m[0]}</button>`).join('')}</div>
        <div class="sub" id="rt">${esc(rt)}</div>
        <div class="acts">
          <button class="link" id="fv" type="button">${fav.has(it.id) ? '♥ Збережено' : '♡ Зберегти'}</button>
          <a class="link" href="${gm}" target="_blank" rel="noopener">Google Maps</a>
          <button class="link" id="sh" type="button">Поділитись</button>
        </div>`;
      $('back').onclick = closeDetail; $('fv').onclick = () => toggleFav(it.id);
      $('sh').onclick = e => { const u = location.href.split('#')[0] + '#p=' + it.id; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => e.target.textContent = 'Посилання скопійовано', () => e.target.textContent = u); };
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; route(it); renderDetail(); });
    }

    function clearRoute() {
      token++; clearTimeout(drawTimer);
      [routeLine, routeFlow, walker, pulse].forEach(l => l && map.removeLayer(l)); routeLine = routeFlow = walker = pulse = null;
      if (routeControl) { map.removeControl(routeControl); routeControl = null; }
    }
    function closeDetail() {
      const prev = sel; sel = null; clearRoute(); prev && paint(prev);
      $('side').classList.remove('open'); history.replaceState(null, '', location.pathname + location.search);
    }
    function select(id) {
      const it = byId(id); if (!it) return;
      const prev = sel; sel = it; prev && paint(prev);
      if (!it.m._map) group.addLayer(it.m);
      paint(it); $('side').classList.add('open'); $('detail').scrollTop = 0;
      history.replaceState(null, '', '#p=' + id);
      $('detail').innerHTML = ''; renderDetail();
      const d = $('detail'); [...d.children].forEach((c, i) => c.style.animationDelay = i * 60 + 'ms'); d.classList.add('enter'); setTimeout(() => d.classList.remove('enter'), 900);
      route(it);
    }

    /* маршрут */
    function runWalker(c, my) {
      walker = L.marker(c[0], { icon: dotIcon('me'), interactive: false, zIndexOffset: 900 }).addTo(map);
      if (reduce) return walker.setLatLng(c[c.length - 1]);
      const cum = [0]; for (let i = 1; i < c.length; i++) cum[i] = cum[i - 1] + map.distance(c[i - 1], c[i]);
      const tot = cum[cum.length - 1] || 1, ms = Math.min(6000, Math.max(2000, tot * 4)), t0 = performance.now(); let s = 1;
      (function f(now) {
        if (my !== token || !walker) return;
        const t = Math.min((now - t0) / ms, 1), d = easeIO(t) * tot;
        while (s < cum.length - 1 && cum[s] < d) s++;
        const k = (d - cum[s - 1]) / ((cum[s] - cum[s - 1]) || 1), a = c[s - 1], b = c[s];
        walker.setLatLng([a.lat + (b.lat - a.lat) * k, a.lng + (b.lng - a.lng) * k]);
        if (t < 1) requestAnimationFrame(f);
      })(t0);
    }
    function flow(c) { routeFlow = L.polyline(c, { color: '#e5484d', weight: 2.5, opacity: .9, dashArray: '1 14', lineCap: 'round', interactive: false, className: 'route-flow' }).addTo(map); }
    function drawRoute(c, my, done) {
      if (my !== token) return;
      routeLine = L.polyline(c, { color: '#111', weight: 4, opacity: .85, lineCap: 'round', lineJoin: 'round', className: 'route-line' }).addTo(map);
      const p = routeLine.getElement();
      if (reduce || !p || !p.getTotalLength) { flow(c); return done(); }
      const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect();
      p.style.transition = 'stroke-dashoffset 1s ease-in-out'; p.style.strokeDashoffset = 0;
      p.addEventListener('transitionend', () => { p.style.strokeDasharray = 'none'; if (my === token) flow(c); done(); }, { once: true });
    }
    function say(t) { const el = $('rt'); if (el) el.textContent = t; }
    function route(it) {
      clearRoute(); const my = token;
      pulse = L.marker(it.coords, { icon: L.divIcon({ className: '', html: '<div class="pulse"></div>', iconSize: [0, 0] }), interactive: false }).addTo(map);
      map.flyTo(it.coords, Math.max(map.getZoom(), 16), { duration: reduce ? 0 : .8 });
      say('Прокладаю маршрут…');
      routeControl = L.Routing.control({
        waypoints: [L.latLng(start), L.latLng(it.coords)],
        router: L.Routing.osrmv1({ serviceUrl: `https://routing.openstreetmap.de/${MODES[mode][1]}/route/v1` }),
        addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: false, show: false, createMarker: () => null,
        lineOptions: { styles: [{ opacity: 0, weight: 1 }] }
      }).on('routesfound', e => {
        if (my !== token) return;
        const r = e.routes[0];
        map.flyToBounds(L.latLngBounds(r.coordinates).extend(it.coords), { padding: [50, 50], duration: 1.2, maxZoom: 17 });
        let drawn = false; const go = () => { if (drawn || my !== token) return; drawn = true; drawRoute(r.coordinates, my, () => my === token && runWalker(r.coordinates, my)); };
        map.once('moveend', go); drawTimer = setTimeout(go, 1500);
        say(`${MODES[mode][0]}: ${(r.summary.totalDistance / 1000).toFixed(1)} км, ${Math.max(1, Math.round(r.summary.totalTime / 60))} хв`);
      }).on('routingerror', () => say('Не вдалося прокласти маршрут. Спробуйте ще раз.')).addTo(map);
    }

    /* кнопки та клавіатура */
    let spinning = false;
    $('rnd').onclick = () => {
      const r = visible(); if (!r.length || spinning) return;
      const pick = r[Math.floor(Math.random() * r.length)];
      if (reduce || r.length < 3) return select(pick.id);
      spinning = true; closeDetail(); $('rnd').classList.add('spin'); let prev = null, n = 0;
      (function step() {
        if (prev) { hov(prev, 0); prev.m.closeTooltip(); }
        if (n++ >= 12) { spinning = false; $('rnd').classList.remove('spin'); select(pick.id); return; }
        prev = r[Math.floor(Math.random() * r.length)]; hov(prev, 1); prev.m.openTooltip();
        setTimeout(step, 50 + n * 14);
      })();
    };
    $('me').onclick = () => navigator.geolocation.getCurrentPosition(p => {
      userStart = true; start = [p.coords.latitude, p.coords.longitude]; startMarker.setLatLng(start); map.setView(start, 15); render(); sel && (renderDetail(), route(sel));
    }, () => { $('count').textContent = 'Немає доступу до геолокації'; });
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); closeDetail(); $('q').focus(); }
      else if (e.key === 'Escape') { sel ? closeDetail() : $('q').blur(); }
    });

    /* дані: добірка + OpenStreetMap (Overpass) */
    function setItems(osm) {
      const cur = CURATED.map(c => {
        const o = c.snap && osm.find(x => c.snap.test(x.name) && map.distance(x.coords, c.coords) < 3000);
        return { ...c, coords: o ? o.coords : c.coords };
      });
      const rest = osm.filter(o => !cur.some(c => map.distance(c.coords, o.coords) < 60 && (c.cat === o.cat || o.name.toLowerCase().includes(c.name.split(' ').pop().toLowerCase()))));
      items.forEach(i => i.m && group.removeLayer(i.m));
      items = [...cur, ...rest]; items.forEach((it, i) => { it._i = i; mk(it); }); render();
      const h = location.hash.match(/p=([\w-]+)/); if (h && byId(h[1]) && !sel) select(h[1]);
    }
    setItems([]);
    async function loadBoundary() {
      try {
        const r = await fetch(OVP, { method: 'POST', body: 'data=' + encodeURIComponent(`[out:json][timeout:25];rel(id:${AREAS});out geom;`) });
        const ways = (await r.json()).elements.flatMap(rel => (rel.members || []).filter(m => m.type === 'way' && m.geometry).map(m => m.geometry.map(g => [g.lat, g.lon])));
        if (!ways.length) return;
        ways.forEach(w => L.polyline(w, { color: '#e5484d', weight: 2, dashArray: '6 6', interactive: false }).addTo(map));
        const b = L.latLngBounds(ways.flat());
        if (!userStart) { const c = b.getCenter(); start = [c.lat, c.lng]; startMarker.setLatLng(start); render(); }
        if (!sel) map.flyToBounds(b, { padding: [30, 30], duration: reduce ? 0 : 1.4 });
      } catch (e) {}
    }
    const Q = `[out:json][timeout:25];rel(id:${AREAS});map_to_area->.a;(nwr[amenity~"^(restaurant|fast_food|cafe|bar|pub)$"][name](area.a);nwr[leisure~"^(park|garden)$"][name](area.a);nwr[tourism~"^(museum|gallery|attraction|viewpoint)$"][name](area.a);nwr[historic~"^(castle|monument|ruins|fort|archaeological_site|building)$"][name](area.a);nwr[shop~"^(supermarket|mall|convenience|bakery|department_store)$"][name](area.a););out center tags 600;`;
    (async () => {
      let data = null; try { data = JSON.parse(sessionStorage.getItem('osm-aliaska-v2')); } catch (e) {}
      if (!data) {
        try {
          const r = await fetch(OVP, { method: 'POST', body: 'data=' + encodeURIComponent(Q) });
          data = (await r.json()).elements; try { sessionStorage.setItem('osm-aliaska-v2', JSON.stringify(data)); } catch (e) {}
        } catch (e) { $('load').remove(); $('count').textContent = 'Не вдалося завантажити місця з OpenStreetMap'; return; }
      }
      $('load').remove(); setItems(data.map(fromOSM).filter(Boolean));
    })();
    loadBoundary();
  </script>
</body>
</html>
